[search]
queries = ["Python", "backend", "frontend"]
sources = ["hh", "remotive", "wwr", "freelancer"]
kinds = ["job", "freelance"]
categories = ["software", "it_ops"] # Empty list uses the text queries below instead.
title_keywords = ["разработчик", "программист", "тестировщик", "инженер", "администратор", "техподдерж", "аналитик данных", "developer", "engineer", "programmer", "tester", "qa", "devops", "sysadmin", "technical support", "data analyst"]
role_ids = [] # Optional exact HH roles, selected in the bot. Overrides broad HH categories.
employment_forms = [] # HH only: FULL, PART, PROJECT, FLY_IN_FLY_OUT.
# salary_min = 100000 # Monthly vacancy salary in salary_currency; excludes unspecified pay.
salary_currency = "RUR"
salary_required = false # Freelance project budgets are handled separately.
excluded_keywords = []
area_ids = ["113"]
experience_ids = ["noExperience", "between1And3"]
remote_only = true
strict_remote = true
days = 7
per_query = 50

[hh]
base_url = "https://api.hh.ru"
user_agent = "JobSearchAutomation/0.1 (YOUR_EMAIL)"
timeout_seconds = 20
browser_fallback = true

[storage]
database = "data/jobs.db"
reports_dir = "reports"

[telegram]
bot_token = ""
allowed_user_ids = []
page_size = 5
profile = "profile.json"

[schedule]
enabled = false
time = "09:00"
timezone = "Asia/Novosibirsk"
