[search]
queries = ["Python", "backend", "frontend"]
sources = ["hh", "remotive", "wwr", "freelancer"]
kinds = ["job", "freelance"]
categories = ["software"] # Development only; empty list uses the text queries below.
title_keywords = ["fullstack", "full-stack", "full stack", "фулстек", "frontend", "front-end", "фронтенд", "backend", "back-end", "бэкенд", "react", "next.js", "typescript", "node.js", "fastify", "python developer", "python engineer", "python-разработчик"]
stack_keywords = ["react", "next.js", "typescript", "node.js", "fastify", "python", "javascript"] # At least one in title or summary.
excluded_title_keywords = ["qa", "tester", "testing", "тестировщик", "тестирование", "quality assurance", "инженер по качеству", "devops", "sre", "sysadmin", "системный администратор", "техподдерж", "react native", "mobile", "мобильн", "data scientist", "дата-сайентист"]
role_ids = [] # Optional exact HH roles, selected in the bot. Overrides broad HH categories.
employment_forms = [] # HH only: FULL, PART, PROJECT, FLY_IN_FLY_OUT.
work_schedules = [] # HH only: FIVE_ON_TWO_OFF, TWO_ON_TWO_OFF, FLEXIBLE, WEEKEND.
# salary_min = 100000 # Monthly vacancy salary in salary_currency; excludes unspecified pay.
salary_currency = "RUR"
salary_required = false # Freelance project budgets are handled separately.
excluded_keywords = []
area_ids = ["113"]
experience_ids = [] # Any experience level until you choose a specific range.
remote_only = true
strict_remote = true
days = 7
per_query = 50

[hh]
base_url = "https://api.hh.ru"
user_agent = "JobSearchAutomation/0.1 (YOUR_EMAIL)"
timeout_seconds = 20
browser_fallback = true

[storage]
database = "data/jobs.db"
reports_dir = "reports"

[telegram]
bot_token = ""
allowed_user_ids = []
page_size = 5
profile = "profile.json"

[schedule]
enabled = false
time = "09:00"
timezone = "Asia/Novosibirsk"
