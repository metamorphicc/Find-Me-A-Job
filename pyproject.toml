[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search-automation"
version = "0.1.0"
description = "Local automation for finding and reviewing job opportunities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.46,<2",
  "requests>=2.31,<3",
  "tzdata>=2025.2",
]

[project.scripts]
job-search = "job_search_automation.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
